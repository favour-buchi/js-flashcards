    <title>Sophisticated Dark Mode Flashcards</title>

<body>

    <form class="input-section card">
        <h2>Create New Flashcard</h2>
        <div class="input-group">
            <label for="questionInput">Question</label>
            <textarea name="question" id="questionInput" placeholder="Enter flashcard question"></textarea>
        </div>
        <div class="input-group">
            <label for="answerInput">Answer</label>
            <textarea name="answer" id="answerInput" placeholder="Enter flashcard answer"></textarea>
        </div>
        <button class="add-card btn-primary">Add Flashcard</button>
    </form>
